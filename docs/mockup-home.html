<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muffin — Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ─── Reset ─────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* ─── Design tokens ─────────────────────────────────────── */
  :root {
    --bg:            #DDE7EF;
    --paper:         #FAFCFD;
    --sidebar:       #E7EEF4;
    --nav-selected:  #E2E7DE;
    --border:        #CBD8E2;
    --border-strong: #6B7C8D;
    --border-guil:   #C2D2DE;
    --ink:           #262B33;
    --body:          #3E4650;
    --muted:         #5A6472;
    --inverse:       #FFFFFF;
    --primary:       #4F5A3C;
    --primary-hover: #3E472E;
    --primary-tint:  #E6EADD;
    --secondary:     #43678A;
    --secondary-tint:#E4EDF2;
    --danger:        #8C3A2C;
    --danger-tint:   #F0E2DE;
    --warning-tint:  #F0E9DD;
    --serif: 'Lora', Georgia, serif;
    --sans:  'Inter', -apple-system, sans-serif;
  }

  /* ─── Shell ──────────────────────────────────────────────── */
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--ink);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .app-window {
    display: flex;
    width: 100%;
    height: 100%;
    position: relative;
  }

  /* ─── Guilloché canvas ───────────────────────────────────── */
  #guilloché {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  /* ─── Sidebar ────────────────────────────────────────────── */
  .sidebar {
    width: 220px;
    flex-shrink: 0;
    background: rgba(231, 238, 244, 0.93);
    display: flex;
    flex-direction: column;
    padding: 0;
    position: relative;
    z-index: 2;
    border-right: 1px solid rgba(203, 216, 226, 0.55);
  }

  .sidebar-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px;
  }

  .brand-mark {
    width: 28px;
    height: 28px;
    border-radius: 5px;
    background: var(--primary);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .brand-mark svg { color: white; }

  .brand-name {
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
  }

  .nav {
    padding: 0 8px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 10px;
    border-radius: 6px;
    cursor: pointer;
    position: relative;
    transition: background 0.12s;
  }
  .nav-item:hover { background: rgba(226,231,222,0.55); }
  .nav-item.selected { background: var(--nav-selected); }

  .nav-item.selected::before {
    content: '';
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 3px;
    height: 16px;
    background: var(--primary);
    border-radius: 99px;
  }

  .nav-icon {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .nav-item.selected .nav-icon svg { color: var(--primary); }
  .nav-item:not(.selected) .nav-icon svg { color: var(--muted); }

  .nav-label {
    font-size: 13px;
    color: var(--body);
  }
  .nav-item.selected .nav-label {
    font-weight: 500;
    color: #4A5232;
  }

  /* ─── Main pane ──────────────────────────────────────────── */
  .main-pane {
    flex: 1;
    position: relative;
    z-index: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  .scroll-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 20px 40px;
    min-height: 100%;
    justify-content: center;
  }

  .center-stack {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    width: 100%;
  }

  /* ─── Home message ───────────────────────────────────────── */
  .home-message {
    font-family: var(--serif);
    font-size: 16px;
    font-style: italic;
    font-weight: 400;
    color: var(--muted);
    text-align: center;
    max-width: 380px;
    line-height: 1.55;
    opacity: 1;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }

  /* ─── Record button ──────────────────────────────────────── */
  .record-button-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .record-btn {
    width: 168px;
    height: 168px;
    border-radius: 50%;
    background: var(--paper);
    border: 1px solid var(--border);
    box-shadow: 0 5px 18px rgba(0,0,0,0.09);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: box-shadow 0.15s, transform 0.1s;
    position: relative;
  }
  .record-btn:hover {
    box-shadow: 0 8px 24px rgba(0,0,0,0.13);
    transform: translateY(-1px);
  }
  .record-btn:active { transform: translateY(0); }

  .record-inner {
    width: 87px;
    height: 87px;
    border-radius: 50%;
    background: #F4F6F8;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .record-inner svg { color: var(--danger); }

  .record-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.04em;
  }
  .indicator-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--border);
  }

  /* ─── OrionCard (timer + waveform) ──────────────────────── */
  .orion-card {
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 18px;
    width: 100%;
    max-width: 360px;
  }

  .card-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .timecode {
    font-family: var(--sans);
    font-size: 28px;
    font-weight: 400;
    letter-spacing: 0.03em;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .waveform {
    display: flex;
    align-items: center;
    gap: 2px;
    height: 40px;
    width: 100%;
    max-width: 300px;
  }
  .waveform-bar {
    flex: 1;
    border-radius: 99px;
    background: rgba(203, 216, 226, 0.85);
    min-width: 1px;
    max-width: 2px;
  }

  /* ─── Live transcript card ───────────────────────────────── */
  .transcript-card {
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 18px;
    width: 100%;
    max-width: 520px;
  }

  .transcript-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .label-caps {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.065em;
    color: var(--primary);
    text-transform: uppercase;
  }

  .transcript-placeholder {
    font-family: var(--serif);
    font-size: 15px;
    color: var(--muted);
    line-height: 1.6;
    min-height: 72px;
    padding-top: 2px;
  }

  /* ─── Time-of-day switcher (demo control) ────────────────── */
  .demo-bar {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    background: rgba(38,43,51,0.9);
    border-radius: 8px;
    padding: 8px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11.5px;
    color: rgba(255,255,255,0.65);
    backdrop-filter: blur(8px);
    user-select: none;
  }
  .demo-bar span { color: rgba(255,255,255,0.4); }
  .time-btn {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 5px;
    color: rgba(255,255,255,0.75);
    font-size: 11.5px;
    font-family: var(--sans);
    padding: 3px 9px;
    cursor: pointer;
    transition: background 0.12s;
  }
  .time-btn:hover { background: rgba(255,255,255,0.18); }
  .time-btn.active {
    background: rgba(79,90,60,0.7);
    border-color: rgba(79,90,60,0.9);
    color: #ffffff;
  }
</style>
</head>
<body>

<div class="app-window">
  <!-- Guilloché background -->
  <canvas id="guilloché"></canvas>

  <!-- Sidebar -->
  <nav class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M8 2a3 3 0 0 1 3 3v4a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3Z" fill="white"/>
          <path d="M3.5 7.5a.5.5 0 0 1 1 0A3.5 3.5 0 0 0 11.5 7.5a.5.5 0 0 1 1 0A4.5 4.5 0 0 1 8.5 11.9V14h-1v-2.1A4.5 4.5 0 0 1 3.5 7.5Z" fill="white"/>
        </svg>
      </div>
      <span class="brand-name">Muffin</span>
    </div>

    <div class="nav">
      <div class="nav-item selected">
        <div class="nav-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </div>
        <span class="nav-label">Record</span>
      </div>

      <div class="nav-item">
        <div class="nav-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </div>
        <span class="nav-label">Recordings</span>
      </div>

      <div class="nav-item">
        <div class="nav-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.07 4.93l-1.41 1.41M4.93 4.93l1.41 1.41M19.07 19.07l-1.41-1.41M4.93 19.07l1.41-1.41M12 2v2M12 20v2M2 12h2M20 12h2"/>
          </svg>
        </div>
        <span class="nav-label">Settings</span>
      </div>
    </div>
  </nav>

  <!-- Main pane -->
  <main class="main-pane">
    <div class="scroll-content">
      <div class="center-stack">

        <!-- Home message -->
        <p class="home-message" id="home-msg">
          What's the first thought worth keeping today?
        </p>

        <!-- Record button -->
        <div class="record-button-wrap">
          <div class="record-btn" title="Start recording">
            <div class="record-inner">
              <!-- Mic icon -->
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                <line x1="12" y1="19" x2="12" y2="23"/>
                <line x1="8" y1="23" x2="16" y2="23"/>
              </svg>
            </div>
          </div>
          <div class="record-indicator">
            <div class="indicator-dot"></div>
            Ready
          </div>
        </div>

        <!-- Timer + waveform card -->
        <div class="orion-card">
          <div class="card-inner">
            <div class="timecode">0:00:00</div>
            <div class="waveform" id="waveform"></div>
          </div>
        </div>

        <!-- Live transcript card -->
        <div class="transcript-card">
          <div class="transcript-header">
            <span class="label-caps">Live Transcript</span>
          </div>
          <div class="transcript-placeholder">
            Words show up here as you talk. Nothing is written to disk until you stop.
          </div>
        </div>

      </div>
    </div>
  </main>
</div>

<!-- Demo switcher -->
<div class="demo-bar">
  <span>Time of day →</span>
  <button class="time-btn active" onclick="setTime('morning')">Morning</button>
  <button class="time-btn" onclick="setTime('midday')">Midday</button>
  <button class="time-btn" onclick="setTime('afternoon')">Afternoon</button>
  <button class="time-btn" onclick="setTime('evening')">Evening</button>
  <button class="time-btn" onclick="setTime('night')">Night</button>
</div>

<script>
// ─── Messages (matching RecordView.swift exactly) ──────────────────────────
const messages = {
  morning: [
    "Good morning.",
    "Ready.",
    "Nothing is saved until you stop.",
    "Transcription runs on-device.",
  ],
  midday: [
    "Good afternoon.",
    "Ready.",
    "Tap to start. Stop to save.",
  ],
  afternoon: [
    "Good afternoon.",
    "Ready when you are.",
    "Transcripts autosave while you speak.",
    "Audio and transcript save to the same folder.",
  ],
  evening: [
    "Good evening.",
    "Ready.",
    "Everything stays on your Mac.",
    "Hold Fn anywhere to start recording.",
  ],
  night: [
    "Good evening.",
    "Still here.",
    "Ready.",
    "Nothing requires an account.",
  ],
};

// Stable daily index
const dayOfYear = Math.floor((Date.now() - new Date(new Date().getFullYear(), 0, 0)) / 86400000);

let currentSlot = 'morning';
let msgIndex = 0;

function setTime(slot) {
  currentSlot = slot;
  const pool = messages[slot];
  msgIndex = dayOfYear % pool.length;

  const el = document.getElementById('home-msg');
  el.style.opacity = '0';
  el.style.transform = 'translateY(-6px)';
  setTimeout(() => {
    el.textContent = pool[msgIndex];
    el.style.transition = 'none';
    el.style.opacity = '0';
    el.style.transform = 'translateY(6px)';
    requestAnimationFrame(() => {
      el.style.transition = 'opacity 0.28s ease, transform 0.28s ease';
      el.style.opacity = '1';
      el.style.transform = 'translateY(0)';
    });
  }, 120);

  document.querySelectorAll('.time-btn').forEach(b => {
    b.classList.toggle('active', b.textContent.toLowerCase() === slot);
  });
}

// ─── Waveform bars (idle = hairline) ──────────────────────────────────────
function buildWaveform() {
  const wf = document.getElementById('waveform');
  const bars = 48;
  for (let i = 0; i < bars; i++) {
    const bar = document.createElement('div');
    bar.className = 'waveform-bar';
    bar.style.height = '2px'; // idle hairline
    wf.appendChild(bar);
  }
}
buildWaveform();

// ─── Guilloché canvas ──────────────────────────────────────────────────────
(function drawGuilloché() {
  const canvas = document.getElementById('guilloché');
  const ctx = canvas.getContext('2d');
  const intensity = 0.18;

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    draw();
  }

  function draw() {
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);

    // Wave field
    const cols = Math.max(28, Math.floor(W / 28));
    const rows = Math.max(22, Math.floor(H / 24));
    ctx.lineWidth = 0.45;
    for (let i = 0; i < cols; i++) {
      ctx.beginPath();
      const u = i / Math.max(cols - 1, 1);
      for (let j = 0; j <= rows; j++) {
        const v = j / rows;
        const wave = Math.sin(v * Math.PI * 4.2 + u * 5.5) * 8
                   + Math.sin(v * Math.PI * 8.5 - u * 3.0) * 3.0;
        const x = u * W + wave * 0.12;
        const y = v * H + wave;
        if (j === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = `rgba(194, 210, 222, ${intensity * 0.9})`;
      ctx.stroke();
    }

    // Corner rosette (top-left)
    drawRosette(ctx, W * 0.1, H * 0.14, Math.min(W, H) * 0.16, intensity);
    // Corner rosette (bottom-right)
    drawRosette(ctx, W * 0.9, H * 0.86, Math.min(W, H) * 0.14, intensity);
  }

  function drawRosette(ctx, ox, oy, maxR, intensity) {
    const rings = 22, steps = 240;
    for (let ring = 1; ring <= rings; ring++) {
      const r = maxR * (ring / rings);
      ctx.beginPath();
      for (let s = 0; s <= steps; s++) {
        const a = (s / steps) * Math.PI * 2;
        const petal = Math.sin(a * 8) * r * 0.035 + Math.sin(a * 16) * r * 0.012;
        const rr = r + petal;
        const x = ox + Math.cos(a) * rr, y = oy + Math.sin(a) * rr;
        if (s === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      const alpha = intensity * (ring % 2 === 0 ? 0.42 : 0.26);
      ctx.strokeStyle = `rgba(79, 90, 60, ${alpha})`;
      ctx.lineWidth = 0.5;
      ctx.stroke();
    }
  }

  window.addEventListener('resize', resize);
  resize();
})();

// Set initial morning message
setTime('morning');
</script>
</body>
</html>

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer
          xcodebuild -version

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -scheme muffin

      - name: Archive
        run: |
          xcodebuild archive \
            -scheme muffin \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Muffin.xcarchive" \
            -sdk macosx \
            -destination generic/platform=macOS \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Export
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Muffin.xcarchive" \
            -exportPath "$RUNNER_TEMP/dist" \
            -exportOptionsPlist scripts/export-options.plist

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Package DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          create-dmg \
            --volname "Muffin" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 128 \
            --icon "Muffin.app" 180 170 \
            --hide-extension "Muffin.app" \
            --app-drop-link 480 170 \
            "$RUNNER_TEMP/Muffin.dmg" \
            "$RUNNER_TEMP/dist/Muffin.app"
          echo "DMG_PATH=$RUNNER_TEMP/Muffin.dmg" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$DMG_PATH" \
            --title "Muffin $VERSION" \
            --generate-notes
